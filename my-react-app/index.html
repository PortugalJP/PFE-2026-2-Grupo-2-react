<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PKZ | One to One</title>
    <!-- Fontes do Google -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" />
    <!-- Ícones (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <!-- Coloca o tema salvo antes da página aparecer -->
    <script>
      (function () {
        try {
          var modo = localStorage.getItem("tema") || "system";
          var tema = modo;
          if (modo === "system") {
            var sistemaEscuro = matchMedia("(prefers-color-scheme: dark)").matches;
            tema = sistemaEscuro ? "dark" : "light";
          }
          document.documentElement.dataset.theme = tema;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Aqui o React coloca o site -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
